# Pigeon Mail — Codex CLI MCP server registration.
#
# Where this goes: ~/.codex/config.toml (merge the table; do not replace the
# file if it already exists).
#
# `codex` starts the process with the environment listed under [env]; the
# paths below are the systemd installer defaults.

[mcp_servers.pigeon-mail]
command = "pigeon"
args = ["mcp"]
# Startup timeout in seconds; the server opens SQLite and the master key, so a
# cold spinning disk can need a few seconds.
startup_timeout_sec = 20.0
tool_timeout_sec = 120.0

[mcp_servers.pigeon-mail.env]
PIGEON_DB_PATH = "/var/lib/pigeon/pigeon.db"
PIGEON_MASTER_KEY_FILE = "/etc/pigeon/master.key"

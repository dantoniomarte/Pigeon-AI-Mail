        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Problem'
      x-scopes:
      - full
  /v1/auth/login:
    post:
      tags:
      - account
      security: []
      summary: 'Dashboard/webmail session login (browser flows; API keys are for machines). Body: email
        plus a required `code` in one of two roles: a TOTP or recovery code when 2FA is enrolled, or a
        one-time bootstrap/invitation token for an account that has no 2FA. A login without `code` is
        rejected with 403 mfa-required. Sets an HttpOnly session cookie (SameSite=Strict).

        '
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: idn-email
                password:
                  type: string
                  description: 'Accepted for contract compatibility but unused — v0.1 has no
                    password realm. Login is `email` + required `code`.'
                code:
                  type: string
                  description: 'TOTP (6 or 8 digits) or one-time recovery code when 2FA is enrolled;
                    otherwise a one-time bootstrap/invitation token from POST /v1/orgs/{id}/members
                    or POST /v1/orgs/{id}/invitations. A code that matches nothing is a 401 — never
                    a silent success.

                    '
      responses:
        '200':
          description: Session established (a valid code was accepted)
          headers:
            Set-Cookie:
              schema:
                type: string
              description: pigeon_session=...; HttpOnly; SameSite=Strict
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '403':
          description: Every login requires a code — missing, invalid, or replayed code, or 2FA challenge; problem type mfa-required for missing code, unauthorized (401) for wrong/replayed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/auth/check:
    get:
      tags:
      - account
      summary: '204 when the session cookie (pigeon_session) is valid. The cookie is HttpOnly, so
        browser JavaScript cannot read it; the webmail probes this endpoint to learn whether a
        session exists without paying for a data fetch.

        '
      operationId: authCheck
      responses:
        '204':
          description: The session cookie is valid
        '401':
          $ref: '#/components/responses/Problem'
  /v1/account/2fa/enroll:
    post:
      tags:
      - account
      summary: Begin TOTP enrollment — SESSION auth (the session is the re-auth in v0.1; a
        password realm lands later). No request body.
      operationId: enroll2fa
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Provisioning data
          content:
            application/json:
              schema:
                type: object
                required:
                - secret_base32
                - otpauth_uri
                properties:
                  secret_base32:
                    type: string
                  otpauth_uri:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/account/2fa/activate:
    post:
      tags:
      - account
      summary: Activate TOTP (returns 10 one-time recovery codes, shown once)
      operationId: activate2fa
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpCode'
      responses:
        '200':
          description: Activated
          content:
            application/json:
              schema:
                type: object
                properties:
                  recovery_codes:
                    type: array
                    items:
                      type: string
                    maxItems: 10
                    minItems: 10
        '422':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/account/2fa/disable:
    post:
      tags:
      - account
      summary: Disable 2FA — SESSION auth; requires a current valid code (TOTP or recovery code)
      operationId: disable2fa
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpCode'
      responses:
        '204':
          description: Disabled
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/account/2fa/verify:
    post:
      tags:
      - account
      summary: Verify a TOTP/recovery code for the current session (step-up checks)
      operationId: verify2fa
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpCode'
      responses:
        '200':
          description: Valid
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
      description: 'Replay protection: the service layer persists the last-used TOTP counter (crypto crate
        owns stateless verify; the service owes consume-once). Attempt limiting: 5 failures/15 min → 429.'
components:
  securitySchemes:
    bearerKey:
      type: http
      scheme: bearer
      description: 'API key pk_... (43 base64url chars). Privilege tier per operation in x-scopes: send
        | read | full (machine-readable extension; bearer schemes cannot carry OAuth-style scopes).'
    sessionCookie:
      type: apiKey
      in: cookie
      name: pigeon_session
      description: Dashboard/webmail session (HttpOnly, SameSite=Strict). 2FA protects these sessions.
  responses:
    Problem:
      description: RFC 7807 problem
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing/invalid key or session
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Rate limit or quota exceeded
      headers:
        Retry-After:
          schema:
            type: integer
            description: seconds
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  headers:
    XRateLimitLimit:
      description: sustained req/s limit for the key
      schema:
        type: integer
    XRateLimitRemaining:
      description: requests remaining in the current window
      schema:
        type: integer
    XRateLimitReset:
      description: unix seconds when the window resets
      schema:
        type: integer
  schemas:
    Problem:
      type: object
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          enum:
          - rate-limited
          - quota-exceeded
          - idempotent-replay
          - not-cancellable
          - validation
          - unauthorized
          - forbidden
          - not-found
          - conflict
          - payload-too-large
          - unavailable
          - mfa-required
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        id:
          type: string
          description: original email id (idempotent-replay only)
        quota:
          type: object
          properties:
            limit:
              type: integer
            used:
              type: integer
            reset_at:
              type: string
              format: date-time
        errors:
          type: array
          items:
            type: object
            required:
            - field
            - message
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
    SendRequest:
      type: object
      additionalProperties: false
      required:
      - from
      - to
      properties:
        from:
          type: string
          maxLength: 320
        to:
          type: array
          maxItems: 50
          items:
            type: string
            format: idn-email
        cc:
          type: array
          items:
            type: string
            format: idn-email
        bcc:
          type: array
          items:
            type: string
            format: idn-email
        reply_to:
          type: string
          format: idn-email
        subject:
          type: string
          maxLength: 998
        html:
          type: string
        text:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
          description: 'Custom headers. Server-set denylist: From, To, Cc, Bcc, Reply-To, Return-Path,
            Received, Message-ID, Date, Content-Type, Content-Transfer-Encoding, DKIM-Signature, Authentication-Results.
            Names and values must not contain CR/LF (422 otherwise). Bcc is envelope-only and never appears
            in the generated MIME.

            '
        attachments:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/Attachment'
        tags:
          type: array
          maxItems: 10
          items:
            type: string
            pattern: ^[a-z0-9-]{1,40}$
        template_id:
          type: string
          pattern: ^tpl_[a-z0-9]{8,32}$
        variables:
          type: object
          additionalProperties: true
        scheduled_at:
          type: string
          format: date-time
        idempotency_key:
          type: string
          maxLength: 255
      description: 'Total recipients across to+cc+bcc ≤ 50. Attachments ≤ 25 MB total (base64-inflated
        ≤ 35 MB request body → 413 beyond). Idempotency dedup: the key is held until the send completes
        AND for 24 h after — scheduled sends are covered for their whole horizon.

        '
    Attachment:
      type: object
      additionalProperties: false
      required:
      - filename
      - content
      properties:
        filename:
          type: string
          maxLength: 255
        content:
          type: string
          contentEncoding: base64
          description: server validates base64; ≤ 25 MB decoded, 25 MB total across attachments
        content_id:
          type: string
          description: inline reference as cid:content_id
    E2e:
      type: string
      description: 'Payload protection actually in force (docs/e2ee-model.md layer 3).

        * `sealed`: the MIME body is OpenPGP-sealed (RFC 4880) to the discovered key of every recipient,
        plus the sending account''s own key so the sent copy stays readable. The sending server, the
        network and the receiving server''s storage cannot read the body.

        * `tls_only`: transport TLS only. Either a recipient published no discoverable key, or every
        recipient is a local account of this instance (delivery never leaves, so layer 1 at-rest
        sealing is what applies).

        * `plaintext_override`: an operator explicitly exempted a recipient domain
        (`PIGEON_E2E_PLAINTEXT_DOMAINS`); always logged, never a default.

        Headers, including `Subject`, stay in the clear in every case: SMTP routing needs them
        (Proton''s documented subject-line caveat). Discovery failures never block delivery.

        '
      enum:
      - sealed
      - tls_only
      - plaintext_override
    SendAccepted:
      type: object
      additionalProperties: false
      required:
      - id
      - status
      properties:
        id:
          type: string
          pattern: ^eml_[a-z0-9]{8,32}$
        status:
          type: string
          enum:
          - queued
          - scheduled
        e2e:
          $ref: '#/components/schemas/E2e'
    BatchResults:
      type: object
      additionalProperties: false
      required:
      - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/BatchResult'
    BatchResult:
      type: object
      required:
      - index
      properties:
        index:
          type: integer
          minimum: 0
        id:
          type: string
        status:
          type: string
        error:
          $ref: '#/components/schemas/Problem'
    EmailStatus:
      type: string
      enum:
      - queued
      - scheduled
      - sending
      - sent
      - deferred
      - bounced
      - failed
      - cancelled
    EmailView:
      type: object
      additionalProperties: false
      required:
      - id
      - status
      - created_at
      properties:
        id:
          type: string
        status:
          $ref: '#/components/schemas/EmailStatus'
        created_at:
          type: string
          format: date-time
        last_event:
          type: string
          format: date-time
          description: timestamp of the latest lifecycle transition
        from:
          type: string
        to:
          type: array
          items:
            type: string
        cc:
          type: array
          items:
            type: string
        subject:
          type: string
        tags:
          type: array
          items:
            type: string
        sandbox:
          type: boolean
          description: true when created by a sandbox key
        e2e:
          $ref: '#/components/schemas/E2e'
        mx:
          type: object
          properties:
            host:
              type: string
            ip:
              type: string
            tls:
              type: string
        deferred:
          type: object
          properties:
            next_attempt_at:

      - created_at
      properties:
        account_id:
          type: integer
        email:
          type: string
          format: email
          description: The mailbox address, so a client does not have to join two listings.
        paused:
          type: boolean
          description: True suspends only this member's copy.
        created_at:
          type: string
          format: date-time
    CatchallSelfScope:
      type: object
      additionalProperties: false
      properties:
        domain:
          type: string

            - size
            properties:
              id:
                type: string
                pattern: ^atc_[a-z0-9]{8,32}$
              filename:
                type: string
              size:
                type: integer
          description: attachment ids discoverable while content stays sealed
    DecryptedMessageView:
      type: object
      additionalProperties: false
      required:
      - id
      - from_addr
      - created_at
      - auth
      properties:
        id:
          type: string
        from_addr:
          type: string
        to:
          type: array
          items:
            type: string
        subject:
          type: string
        created_at:
          type: string
          format: date-time
        body_text:
          type: string
          description: plain-text part; absent for html-only messages
        body_html:
          type: string
          description: html part; absent for text-only messages
        attachments:
          type: array
          items:
            type: object
            required:
            - id
            - filename
            - size
            properties:
              id:
                type: string
                pattern: ^atc_[a-z0-9]{8,32}$
              filename:
                type: string
              size:
                type: integer
        auth:
          $ref: '#/components/schemas/AuthVerdict'
    AuthVerdict:
      type: object
      additionalProperties: false
      required:
      - spf
      - dkim
      - dmarc
      properties:
        spf:
          type: string
          enum:
          - pass
          - fail
          - softfail
          - none
          - neutral
        dkim:
          type: string
          enum:
          - pass
          - fail
          - none
        dmarc:
          type: string
          enum:
          - pass
          - fail
          - none
        tls:
          type: string
    MessageSummary:
      type: object
      additionalProperties: false
      required:
      - folder
      - read
      properties:
        id:
          type: string
          pattern: ^msg_[a-z0-9]{8,32}$
        from_addr:
          type: string
        subject:
          type: string
        created_at:
          type: string
          format: date-time
        folder:
          type: string
          enum:
          - inbox
          - sent
          - spam
          - trash
        read:
          type: boolean
        delivered_for:
          type: string
          format: email
          description: 'Address this copy was delivered for, when it is not the mailbox own: a sender
            alias (`sales@example.com`) or the catch-all local part. Absent on ordinary mail; the webmail
            groups the inbox by it.

            '
    MessagePage:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      - counts
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MessageSummary'
        page:
          $ref: '#/components/schemas/PageMeta'
        counts:
          $ref: '#/components/schemas/FolderCounts'
        delivered_for_counts:
          type: array
          description: Inbox counts per shared address, so a client renders one pseudo-folder per alias
            or catch-all without a second request.
          items:
            $ref: '#/components/schemas/DeliveredForCount'
    DeliveredForCount:
      type: object
      additionalProperties: false
      required:
      - address
      - count
      properties:
        address:
          type: string
          format: email
        count:
          type: integer
          minimum: 0
    FolderCounts:
      type: object
      additionalProperties: false
      description: Per-folder totals and unread counts for the caller's account, so a client renders the
        sidebar badges without a second request. `sent` carries no unread field because an outbound copy
        is never unread.
      required:
      - inbox
      - sent
      - spam
      - trash
      - unread_inbox
      - unread_spam
      - unread_trash
      properties:
        inbox:
          type: integer
          minimum: 0
        sent:
          type: integer
          minimum: 0
        spam:
          type: integer
          minimum: 0
        trash:
          type: integer
          minimum: 0
        unread_inbox:
          type: integer
          minimum: 0
          description: Inbox messages whose read state is still unread.
        unread_spam:
          type: integer
          minimum: 0
        unread_trash:
          type: integer
          minimum: 0
    MessagePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        folder:
          type: string
          enum:
          - inbox
          - sent
          - spam
          - trash
        read:
          type: boolean
    EmptyTrashResult:
      type: object
      additionalProperties: false
      required:
      - deleted
      properties:
        deleted:
          type: integer
          minimum: 0
    PurgeTrashResult:
      type: object
      additionalProperties: false
      required:
      - deleted
      - trash_remaining
      properties:
        deleted:
          type: integer
          minimum: 0
          description: Messages removed by this run (only those past the retention window)
        trash_remaining:
          type: integer
          minimum: 0
          description: Messages still in the trash afterwards
    AccountSettings:
      type: object
      additionalProperties: false
      required:
      - trash_retention_days
      properties:
        trash_retention_days:
          type: integer
          minimum: 0
          maximum: 365
          description: 'Days a message stays in the trash before it is deleted
            automatically. `0` keeps trashed mail forever. Default 30.

            '
    AccountSettingsPatch:
      type: object
      additionalProperties: false
      required:
      - trash_retention_days
      properties:
        trash_retention_days:
          type: integer
          minimum: 0
          maximum: 365
    Template:

        id:
          type: integer
          description: Organization id (an integer, not an opaque handle)
        name:
          type: string
        created_at:
          type: string
          format: date-time
        role:
          type: string
          enum:
          - owner
          - admin
          - member
          description: The caller's role in this organization (present on the listings)
    OrgMember:
      type: object
      required:
      - account_id
      - email
      - display_name
      - role
      - created_at
      properties:
        account_id:
          type: integer
        email:
          type: string
          format: idn-email
        display_name:
          type: string
          description: Empty when nobody has set one
        role:
          type: string
          enum:
          - owner
          - admin
          - member
        created_at:
          type: string
          format: date-time
    OrgMemberCreated:
      type: object
      required:
      - member

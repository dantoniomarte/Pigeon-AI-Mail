            - email.received
        secret:
          type: string
          minLength: 32
          pattern: ^[A-Za-z0-9_-]+$
          description: 'Optional: server generates whsec_... when omitted. If provided: ≥32 chars of [A-Za-z0-9_-].'
    WebhookView:
      type: object

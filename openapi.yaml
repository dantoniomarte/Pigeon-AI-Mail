openapi: 3.1.0
info:
  title: Pigeon Mail API
  version: 0.1.2
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
  description: 'Self-hosted encrypted email server. Contract counterpart of docs/API.md — the two are
    kept in lockstep (CI lints this spec; docs/API.md is the prose mirror); CI lints this file''s YAML
    validity.

    Resend compatibility (deliberate deviations, see docs/API.md): send endpoints return **202 Accepted**
    (at-least-once pipeline; Resend returns 200), idempotent replays return **409 with the original id**
    (Resend returns 200), and `email.delivered`-style webhook field names are documented in the Event
    schemas below. Everything else follows the Resend send schema.

    Scopes: `send` → POST /v1/emails*, DELETE /v1/emails/{id}, template and draft writes, the sender-alias self
    view (`GET /v1/aliases`) and the caller''s own catch-all pause (`POST /v1/catchall/me/pause|resume`). `read` → all
    other GETs (metadata + sealed blobs). `full` → everything, including decrypted bodies, keys, webhooks, domains,
    suppressions, account admin, sender-alias administration, and multi-tenant administration (organizations,
    members, invitations, catch-all routing).

    Errors are RFC 7807 `application/problem+json`. The WKD key-directory endpoints (`/.well-known/pigeon-pgp`
    and `/.well-known/openpgpkey/...`) are unauthenticated and rate limited per source address: 5 req/s
    sustained with a bounded burst, `429` with `Retry-After` beyond it.
    Rate limits (per key): 10 req/s sustained, burst 50;
    daily send quota per account (default 50,000). Responses carry X-RateLimit-Limit / X-RateLimit-Remaining
    / X-RateLimit-Reset; 429 carries Retry-After. Problem types: rate-limited, quota-exceeded, idempotent-replay,
    not-cancellable, validation, unauthorized, forbidden, from-not-allowed, not-found, conflict, last-owner,
    mfa-required.

    '
servers:
- url: https://mail.example.com
security:
- bearerKey: []
tags:
- name: send
- name: receive
- name: templates
- name: drafts
- name: domains
- name: webhooks
- name: account
- name: orgs
- name: catchall
- name: aliases
- name: system
paths:
  /.well-known/pigeon-pgp:
    get:
      tags:
      - system
      security: []
      summary: Publish the OpenPGP key of a local address (WKD simple endpoint)
      description: 'The Pigeon-to-Pigeon key directory: any instance (or PGP client) can fetch the
        certificate it must seal mail to for `email`.

        Answers only for accounts of this instance. A sender alias has several owners, so it publishes
        nothing. The key is created on the first request for an existing account that never needed one
        yet, so an address may answer 404 once and 200 afterwards.

        Discovery failures on the sending side never block delivery: the message goes out `tls_only`.

        '
      operationId: pigeonWkdKey
      parameters:
      - name: email
        in: query
        required: true
        schema:
          type: string
          format: email
      responses:
        '200':
          description: Armored OpenPGP certificate
          content:
            application/pgp-keys:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-rate-limit: 'per source address, unauthenticated: 5 req/s sustained with a bounded burst (Retry-After on 429)'
  /.well-known/openpgpkey/{domain}/hu/{hash}:
    get:
      tags:
      - system
      security: []
      summary: Publish a local key under its advanced-WKD hash (draft-koch-openpgp-webkey-service)
      description: 'The same certificate as the simple endpoint, in binary, keyed by
        z-base-32(SHA-1(lowercased local part)) for a domain this instance serves.

        A wrong hash and a foreign domain both answer 404, so the endpoint cannot be used to enumerate
        addresses of other domains.

        '
      operationId: advancedWkdKey
      parameters:
      - name: domain
        in: path
        required: true
        schema:
          type: string
      - name: hash
        in: path
        required: true
        schema:
          type: string
          pattern: ^[ybndrfg8ejkmcpqxot1uwisza345h769]{1,64}$
      responses:
        '200':
          description: Binary OpenPGP certificate
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-rate-limit: 'shared with the simple endpoint: per source address, unauthenticated'
  /healthz:
    get:
      tags:
      - system
      security: []
      summary: Liveness probe
      operationId: healthz
      responses:
        '200':
          description: OK
  /readyz:
    get:
      tags:
      - system
      security: []
      summary: Readiness probe (store reachable + master key present)
      operationId: readyz
      responses:
        '200':
          description: Ready
        '503':
          $ref: '#/components/responses/Problem'
  /v1/emails:
    post:
      tags:
      - send
      summary: Queue an email (202 — accepted, at-least-once delivery)
      operationId: sendEmail
      security:
      - bearerKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendRequest'
      responses:
        '202':
          description: Queued or scheduled
          headers:
            X-RateLimit-Limit: &id001
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining: &id002
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset: &id003
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-scopes:
      - send
    get:
      tags:
      - send
      summary: List sent emails (newest first; bcc is never echoed)
      operationId: listEmails
      security:
      - bearerKey: []
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/EmailStatus'
      - name: tag
        in: query
        schema:
          type: string
          pattern: ^[a-z0-9-]{1,40}$
      responses:
        '200':
          description: Page of emails (no bodies) with pagination metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-scopes:
      - read
  /v1/emails/batch:
    post:
      tags:
      - send
      summary: Queue up to 100 emails (per-item results; one bad item never blocks the rest)
      operationId: sendBatch
      security:
      - bearerKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - items
              properties:
                items:
                  type: array
                  maxItems: 100
                  items:
                    $ref: '#/components/schemas/SendRequest'
      responses:
        '202':
          description: Per-item results
          headers:
            X-RateLimit-Limit: *id001
            X-RateLimit-Remaining: *id002
            X-RateLimit-Reset: *id003
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResults'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-scopes:
      - send
  /v1/emails/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^eml_[a-z0-9]{8,32}$
    get:
      tags:
      - send
      summary: Email lifecycle view (bcc never echoed)
      operationId: getEmail
      security:
      - bearerKey: []
      parameters:
      - name: raw
        in: query
        schema:
          type: boolean
        description: 'Return the exact generated MIME. Only allowed for messages created by a sandbox
          key — a sandbox key requesting a non-sandbox message gets 403.

          '
      responses:
        '200':
          description: The email (or, with raw=true on a sandbox message, the SandboxMessage)
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/EmailView'
                - $ref: '#/components/schemas/SandboxMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-scopes:
      - read
    delete:
      tags:
      - send
      summary: Cancel while queued/scheduled (409 not-cancellable otherwise)
      operationId: cancelEmail
      security:
      - bearerKey: []
      responses:
        '202':
          description: Cancelled
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Problem'
      x-scopes:
      - send
  /v1/messages:
    get:
      tags:
      - receive
      summary: List one folder of messages (metadata only, never bodies) plus per-folder counts
      operationId: listMessages
      security:
      - bearerKey: []
      parameters:
      - name: folder
        in: query
        schema:
          type: string
          enum:
          - inbox
          - sent
          - spam
          - trash
          default: inbox
        description: >-
          Folder to list. Omitted means inbox. The folder follows the message
          direction: mail this account sent is stored in `sent`, received mail
          (alias and catch-all copies included) in `inbox`.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: delivered_for
        in: query
        schema:
          type: string
          format: email
        description: 'Only the inbox copies delivered **for** this address: a sender alias or the catch-all
          local part the sender wrote. This is the webmail pseudo-folder filter; the message itself stays in
          `inbox`. When it is present the listing is pinned to the inbox and `folder` is ignored.

          '
      responses:
        '200':
          description: 'Page of messages, newest first, with the per-folder counts the sidebar renders
            as badges. Message pages default larger than outbound pages (500 vs 100) because inbound triage
            scans more rows; both expose has_more.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-scopes:
      - read
  /v1/messages/empty-trash:
    post:
      tags:
      - receive
      summary: Permanently delete every message in the trash folder
      operationId: emptyTrash
      security:
      - bearerKey: []
      responses:
        '200':
          description: Trash emptied (idempotent; an already-empty trash answers deleted 0)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyTrashResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-scopes:
      - send
  /v1/messages/purge-trash:
    post:
      tags:
      - receive
      summary: Run the trash retention purge now (the same sweep the server runs every 6 hours)
      operationId: purgeTrash
      security:
      - bearerKey: []
      - sessionCookie: []
      description: 'Deletes the caller''s trashed messages whose retention window
        (`trash_retention_days`) has expired, and nothing else: fresher trash, the
        inbox, sent and spam folders, and every other account are left alone. A
        retention of `0` (keep forever) deletes nothing. Idempotent: a second call
        with nothing expired answers `deleted: 0`.

        '
      responses:
        '200':
          description: Purge finished
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurgeTrashResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-scopes:
      - send
  /v1/messages/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^msg_[a-z0-9]{8,32}$
    get:
      tags:
      - receive
      summary: 'One inbound message. Default returns SealedMessageView (ciphertext only). Plaintext (DecryptedMessageView)
        requires scope full.

        '
      operationId: getMessage
      security:
      - bearerKey: []
      parameters:
      - name: sealed
        in: query
        schema:
          type: boolean
          default: true
        description: true (default) returns the sealed blob; false requests decryption (scope full required)
      responses:
        '200':
          description: Sealed view (default) or decrypted view (scope full)
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/SealedMessageView'
                - $ref: '#/components/schemas/DecryptedMessageView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-scopes:
      - read
    patch:
      tags:
      - receive
      summary: Move a message between folders and/or set its read state
      operationId: patchMessage
      security:
      - bearerKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessagePatch'
      responses:
        '200':
          description: The updated message metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-scopes:
      - send
    delete:
      tags:
      - receive
      summary: Permanently delete a message and its lifecycle metadata (trash follows the same route)
      description: "Accepts the msg_ id of any owned message, or the eml_ id of an owned outbound
        email (the id GET /v1/emails hands out for sent mail). An email that is still queued or
        scheduled is refused with 409 not-cancellable, pointing at DELETE /v1/emails/{id} (cancel)
        instead. Deleting a sent email is permanent and irreversible: there is no trash round-trip
        for outbound mail.\n"
      operationId: deleteMessage
      security:
      - bearerKey: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^(?:msg|eml)_[a-z0-9]{8,32}$
        description: msg_ id of an owned message, or eml_ id of an owned sent email
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-scopes:
      - send
  /v1/messages/export:
    get:
      tags:
      - receive
      summary: Back up a whole folder as one mbox archive (mboxrd)
      operationId: exportFolder
      security:
      - bearerKey: []
      parameters:
      - name: folder
        in: query
        required: false
        schema:
          type: string
          enum: [inbox, sent, spam, trash]
          default: inbox
      responses:
        '200':
          description: The mbox archive
          content:
            application/mbox:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-scopes:
      - full
  /v1/messages/{id}/export:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^(?:msg|eml)_[a-z0-9]{8,32}$
    get:
      tags:
      - receive
      summary: Back up one message as its original RFC822 document
      operationId: exportMessage
      security:
      - bearerKey: []
      responses:
        '200':
          description: The RFC822 document
          content:
            message/rfc822:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-scopes:
      - full
  /v1/messages/{id}/attachments/{aid}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^(?:msg|eml)_[a-z0-9]{8,32}$
      description: msg_ id of an owned message, or eml_ id of an owned sent email (the handler resolves both)
    - name: aid
      in: path
      required: true
      schema:
        type: string
        pattern: ^atc_[a-z0-9]{8,32}$
    - name: sealed
      in: query
      schema:
        type: boolean
        default: true
    get:
      tags:
      - receive
      summary: Download one attachment (sealed blob by default; decrypted requires scope full)
      operationId: getMessageAttachment
      security:
      - bearerKey: []
      responses:
        '200':
          description: Attachment bytes (application/octet-stream)
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
      x-scopes:
      - read
  /v1/templates:
    get:
      tags:
      - templates
      summary: List templates
      operationId: listTemplates
      security:
      - bearerKey: []
      responses:
        '200':
          description: Templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Template'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-scopes:
      - read
    post:
      tags:
      - templates
      summary: Create template (name unique per account)
      operationId: createTemplate
      security:
      - bearerKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-scopes:
      - send
  /v1/templates/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^tpl_[a-z0-9]{8,32}$
    get:
      tags:
      - templates
      summary: Get template
      operationId: getTemplate
      security:
      - bearerKey: []
      responses:
        '200':
          description: The template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '404':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-scopes:
      - read
    patch:
      tags:
      - templates
      summary: Partial update (id/updated_at are server-owned; 409 on duplicate name)
      operationId: updateTemplate
      security:
      - bearerKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplatePatch'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '409':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-scopes:
      - send
    delete:
      tags:
      - templates
      summary: Delete template
      operationId: deleteTemplate
      security:
      - bearerKey: []
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-scopes:
      - send
  /v1/templates/{id}/test-send:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^tpl_[a-z0-9]{8,32}$
    post:
      tags:
      - templates
      summary: Send a rendered template test
      operationId: testTemplate
      security:
      - bearerKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - to
              properties:
                to:
                  type: array
                  items:
                    type: string
                    format: idn-email
                  maxItems: 5
                variables:
                  type: object
                  additionalProperties: true
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendAccepted'
        '402':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-scopes:
      - send
  /v1/drafts:
    get:
      tags:
      - drafts
      summary: List saved drafts (newest save first)
      operationId: listDrafts
      security:
      - bearerKey: []
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: Page of drafts, bodies included (a draft is small and the
            compose box needs it back verbatim)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-scopes:
      - read
    post:
      tags:
      - drafts
      summary: Save a new draft
      operationId: createDraft
      security:
      - bearerKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftCreate'
      responses:
        '201':
          description: Draft saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Draft'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-scopes:
      - send

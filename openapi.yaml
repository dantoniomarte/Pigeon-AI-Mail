              - account_id
              properties:
                account_id:
                  type: integer
      responses:
        '200':
          description: The alias with its assignees after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenderAlias'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
      x-scopes:
      - full
  /v1/aliases/{id}/unassign:
    post:
      tags:
      - aliases
      summary: Stop one account sending as the alias and receiving its mail (owner/admin)
      operationId: unassignAlias
      security:
      - bearerKey: []
      - sessionCookie: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - account_id
              properties:
                account_id:
                  type: integer
      responses:
        '200':
          description: The alias with its assignees after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenderAlias'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
      x-scopes:
      - full
  /v1/account/settings:
    get:
      tags:
      - account
      summary: Read the account's mailbox policy (trash retention)
      operationId: getAccountSettings
      security:
      - bearerKey: []
      - sessionCookie: []
      responses:
        '200':
          description: Current settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-scopes:
      - read
    patch:
      tags:
      - account
      summary: Update the account's mailbox policy (trash retention)
      operationId: updateAccountSettings
      security:
      - bearerKey: []
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountSettingsPatch'
      responses:
        '200':
          description: Updated settings (the response is the stored policy, not the request)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
      description: 'Changes how long a trashed message survives. `0` means "keep
        forever" and is a valid value; values outside `0..=365` are `422` with a
        field-level error rather than a silent clamp, because a clamped retention
        would delete mail the caller did not ask to delete.

        '
      x-scopes:
      - send
  /v1/account/keys:
    post:
      tags:

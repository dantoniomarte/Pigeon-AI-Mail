        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        accepted_at:
          type: string
          format: date-time
          description: Present once redeemed (the row is kept as history)
    InvitationCreated:
      type: object
      required:
      - invitation
      - token
      properties:
        invitation:
          $ref: '#/components/schemas/Invitation'
        token:
          type: string
          description: 'Shown once. Only the Argon2id hash is stored; the first redemption burns it.

            '
    CatchallRule:
      type: object
      additionalProperties: false
      required:
      - domain
      - action
      - created_at
      properties:
        domain:
          type: string
        action:
          type: string
          enum:
          - route
          - discard
        assignments:
          type: array
          description: Every account holding the catch-all, paused or live. A `route` rule copies the
            message to each non-paused one; `discard` stores nothing and leaves the list alone.
          items:
            $ref: '#/components/schemas/CatchallAssignment'
        created_at:
          type: string
          format: date-time
    CatchallAssignment:
      type: object
      additionalProperties: false
      required:

      x-scopes:
      - full
  /v1/account/keys/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^key_[a-z0-9]{8,32}$
    patch:
      tags:
      - account
      summary: 'Update key (revoke: revoked=true; sandbox toggle)'
      operationId: updateApiKey
      security:
      - bearerKey: []
      requestBody:

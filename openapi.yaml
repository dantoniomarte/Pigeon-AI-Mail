        name:
          type: string
          maxLength: 100
        scopes:
          type: array
          items:
            type: string
            enum:
            - send
            - read
            - full
          minItems: 1
        sandbox:
          type: boolean
          default: false
    ApiKeyPatch:
      type: object
      additionalProperties: false
      properties:
        revoked:
          type: boolean
        sandbox:
          type: boolean
        name:
          type: string
          maxLength: 100
    ApiKeyCreated:
      type: object
      additionalProperties: false
      required:
      - id

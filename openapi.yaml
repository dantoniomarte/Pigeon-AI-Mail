        revoked:
          type: boolean
        last_used_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
    TotpCode:
      type: object
      additionalProperties: false
      required:
      - code
      properties:
        code:
          oneOf:
          - type: string
            pattern: ^[0-9]{6}$
          - type: string
            pattern: ^[0-9]{8}$
          - type: string
            pattern: ^[A-Za-z0-9-]{10,20}$
            description: one-time recovery code (activation-fallback only)
    Event:
      type: object
      additionalProperties: false
      required:
      - type
      - created_at
      - data
      properties:
        type:
          type: string
          enum:
          - email.sent
          - email.delivered
          - email.delivery_delayed
          - email.bounced
          - email.failed
          - email.received
        created_at:
          type: string
          format: date-time
        data:
          $ref: '#/components/schemas/EventData'
    EventData:
      type: object
      properties:
        email_id:
          type: string
          pattern: ^eml_[a-z0-9]{8,32}$
        message_id:
          type: string
          pattern: ^msg_[a-z0-9]{8,32}$
        from_addr:
          type: string
        to:
          oneOf:
          - type: string
            description: single recipient (delivered-style events)
          - type: array
            items:
              type: string
        subject:
          type: string
        mx:
          type: string
        attempts:
          type: integer
        code:
          type: string
          description: bounce code
        reason:
          type: string
        hard:
          type: boolean
        auth:
          $ref: '#/components/schemas/AuthVerdict'
      description: 'Field names match the internal contract (from_addr, to arrays where multiple, auth
        object). Resend-style consumers map from_addr to from. Sandbox sends NEVER emit delivery webhooks.

        '
      additionalProperties: false

    Org:
      type: object
      required:
      - id
      - name
      - created_at

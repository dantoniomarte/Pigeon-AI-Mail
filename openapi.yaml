      - catchall
      summary: Pause or force-resume one member's catch-all copy (owner/admin)
      description: 'The administrator override: a member pauses their own copy with `POST /v1/catchall/me/pause`,
        and an owner/admin can pause **or resume** it here. Force-resuming somebody who paused and never
        came back is why this exists; every call is audited as `catchall.force`.

        '
      operationId: patchCatchallAssignment
      security:
      - bearerKey: []
      - sessionCookie: []
      parameters:
      - name: domain
        in: path
        required: true
        schema:
          type: string
      - name: account_id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - paused
              properties:
                paused:
                  type: boolean
      responses:
        '200':
          description: The assignment after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatchallAssignment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
      x-scopes:
      - full
  /v1/catchall/me/pause:
    post:
      tags:
      - catchall
      summary: Pause the caller's own catch-all copy (any member)
      description: 'Session or API key; only the caller own row. Omit `domain` when the account holds
        exactly one catch-all; holding several requires naming one, because guessing would pause the wrong
        address. `409 conflict` when the caller holds none.

        '
      operationId: pauseOwnCatchall
      security:
      - bearerKey: []
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatchallSelfScope'
      responses:
        '200':
          description: The assignment, now paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatchallAssignment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
      x-scopes:
      - send
  /v1/catchall/me/resume:
    post:
      tags:
      - catchall
      summary: Resume the caller's own catch-all copy (any member)
      operationId: resumeOwnCatchall

        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
    WebhookCreated:
      type: object
      additionalProperties: false
      required:
      - id
      - url
      - events
      - created_at
      - secret
      properties:
        id:
          type: string
          pattern: ^whk_[a-z0-9]{8,32}$
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        secret:

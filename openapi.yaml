        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatchallSelfScope'
      responses:
        '200':
          description: The assignment, now live
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatchallAssignment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
      x-scopes:
      - send
  /v1/aliases:
    get:
      tags:
      - aliases
      summary: Sender aliases visible to the caller
      description: 'An owner/admin sees every alias of the deployment with its assignees. A member sees
        only the aliases assigned to them, which is what the compose From list offers. `?mine=1` always
        narrows to the caller own aliases, whatever their role.

        '
      operationId: listAliases
      security:
      - bearerKey: []
      - sessionCookie: []
      parameters:
      - name: mine
        in: query
        schema:
          type: boolean
          default: false
        description: Only the aliases assigned to the caller (the compose-box list).
      responses:
        '200':
          description: Aliases, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SenderAlias'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Problem'
      x-scopes:
      - send
    post:
      tags:
      - aliases
      summary: Claim a free address on a served domain as a sender alias (owner/admin)
      description: 'An alias owns no mailbox: mail to it is copied into every assignee inbox and every
        assignee may send as it. The address must parse, its domain must be one this deployment serves
        (an account on it or a DKIM key for it), and it must collide with neither an account address nor
        another alias.

        The rule holds in both directions: an existing account cannot become an alias (`422`), and a new
        mailbox can never be created on an alias address (`409 conflict` on `POST /v1/orgs/{id}/members`
        and from the installer), so a shared address is never diverted into one inbox.

        '
      operationId: createAlias
      security:
      - bearerKey: []
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - address
              properties:
                address:
                  type: string
                  format: email
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenderAlias'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
      x-scopes:
      - full
  /v1/aliases/{id}:
    delete:
      tags:
      - aliases
      summary: Delete a sender alias and every assignment to it (owner/admin)
      description: Mail already delivered keeps its `delivered_for` marker; revoking a grant never rewrites
        a mailbox history.
      operationId: deleteAlias
      security:
      - bearerKey: []
      - sessionCookie: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
      x-scopes:
      - full
  /v1/aliases/{id}/assign:
    post:
      tags:
      - aliases
      summary: Let one account send as the alias and receive its mail (owner/admin)
      operationId: assignAlias
      security:
      - bearerKey: []
      - sessionCookie: []
      parameters:
      - name: id
        in: path
        required: true

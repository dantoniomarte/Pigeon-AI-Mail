      - domain
      - created_at
      properties:
        id:
          type: integer
        address:
          type: string
          format: email
          description: Normalized address (`sales@example.com`).
        domain:
          type: string
        assignments:
          type: array
          description: Accounts that may send as the alias and receive a copy of its mail.
          items:
            $ref: '#/components/schemas/AliasAssignment'
        created_at:
          type: string
          format: date-time
    AliasAssignment:
      type: object
      additionalProperties: false
      required:
      - account_id
      - created_at
      properties:
        account_id:
          type: integer
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time

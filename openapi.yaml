openapi: 3.1.0
info:
  title: Pigeon Mail API
  version: 0.1.0
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
  description: 'Self-hosted encrypted email server. Contract counterpart of docs/API.md — the two are
    kept in lockstep (CI lints this spec; docs/API.md is the prose mirror); CI lints this file''s YAML
    validity.

    Resend compatibility (deliberate deviations, see docs/FEATURES.md): send endpoints return **202 Accepted**
    (at-least-once pipeline; Resend returns 200), idempotent replays return **409 with the original id**
    (Resend returns 200), and `email.delivered`-style webhook field names are documented in the Event
    schemas below. Everything else follows the Resend send schema.

    Scopes: `send` → POST /v1/emails*, DELETE /v1/emails/{id}, template and draft writes. `read` → all GETs
    (metadata + sealed blobs). `full` → everything, including decrypted bodies, keys, webhooks, domains, suppressions,
    account admin, and multi-tenant administration (organizations, members, invitations, catch-all routing).

    Errors are RFC 7807 `application/problem+json`. Rate limits (per key): 10 req/s sustained, burst 50;
    daily send quota per account (default 50,000). Responses carry X-RateLimit-Limit / X-RateLimit-Remaining
    / X-RateLimit-Reset; 429 carries Retry-After. Problem types: rate-limited, quota-exceeded, idempotent-replay,
    not-cancellable, validation, unauthorized, forbidden, not-found, conflict, last-owner, mfa-required.

    '
servers:
- url: https://mail.example.com
security:
- bearerKey: []
tags:
- name: send
- name: receive
- name: templates
- name: drafts
- name: domains
- name: webhooks
- name: account
- name: orgs
- name: catchall
- name: system
paths:
  /healthz:
    get:
      tags:
      - system
      security: []
      summary: Liveness probe
      operationId: healthz
      responses:
        '200':
          description: OK
  /readyz:
    get:
      tags:
      - system
      security: []
      summary: Readiness probe (store reachable + master key present)
      operationId: readyz
      responses:
        '200':
          description: Ready
        '503':
          $ref: '#/components/responses/Problem'
  /v1/emails:
    post:
      tags:
      - send
      summary: Queue an email (202 — accepted, at-least-once delivery)
      operationId: sendEmail
      security:
      - bearerKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendRequest'
      responses:
        '202':
          description: Queued or scheduled
          headers:
            X-RateLimit-Limit: &id001
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining: &id002
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset: &id003
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-scopes:
      - send
    get:
      tags:
      - send
      summary: List sent emails (newest first; bcc is never echoed)
      operationId: listEmails
      security:
      - bearerKey: []
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/EmailStatus'
      - name: tag
        in: query
        schema:
          type: string
          pattern: ^[a-z0-9-]{1,40}$
      responses:
        '200':
          description: Page of emails (no bodies) with pagination metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-scopes:
      - read
  /v1/emails/batch:
    post:
      tags:
      - send
      summary: Queue up to 100 emails (per-item results; one bad item never blocks the rest)
      operationId: sendBatch
      security:
      - bearerKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - items
              properties:
                items:
                  type: array
                  maxItems: 100
                  items:
                    $ref: '#/components/schemas/SendRequest'
      responses:
        '202':
          description: Per-item results
          headers:
            X-RateLimit-Limit: *id001
            X-RateLimit-Remaining: *id002
            X-RateLimit-Reset: *id003
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResults'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-scopes:
      - send
  /v1/emails/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^eml_[a-z0-9]{8,32}$
    get:
      tags:
      - send
      summary: Email lifecycle view (bcc never echoed)
      operationId: getEmail
      security:
      - bearerKey: []
      parameters:
      - name: raw
        in: query
        schema:
          type: boolean
        description: 'Return the exact generated MIME. Only allowed for messages created by a sandbox
          key — a sandbox key requesting a non-sandbox message gets 403.

          '
      responses:
        '200':
          description: The email (or, with raw=true on a sandbox message, the SandboxMessage)
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/EmailView'
                - $ref: '#/components/schemas/SandboxMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-scopes:
      - read
    delete:
      tags:
      - send
      summary: Cancel while queued/scheduled (409 not-cancellable otherwise)
      operationId: cancelEmail
      security:
      - bearerKey: []
      responses:
        '202':
          description: Cancelled
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Problem'
      x-scopes:
      - send
  /v1/messages:
    get:
      tags:
      - receive
      summary: List one folder of messages (metadata only, never bodies) plus per-folder counts
      operationId: listMessages
      security:
      - bearerKey: []
      parameters:
      - name: folder
        in: query
        schema:
          type: string
          enum:
          - inbox
          - sent
          - spam
          - trash
          default: inbox
        description: Folder to list. Omitted means inbox.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: 'Page of messages, newest first, with the per-folder counts the sidebar renders
            as badges. Message pages default larger than outbound pages (500 vs 100) because inbound triage
            scans more rows; both expose has_more.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-scopes:
      - read
  /v1/messages/empty-trash:
    post:
      tags:
      - receive
      summary: Permanently delete every message in the trash folder
      operationId: emptyTrash
      security:
      - bearerKey: []
      responses:
        '200':
          description: Trash emptied (idempotent; an already-empty trash answers deleted 0)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyTrashResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-scopes:
      - send
  /v1/messages/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^msg_[a-z0-9]{8,32}$
    get:
      tags:
      - receive
      summary: 'One inbound message. Default returns SealedMessageView (ciphertext only). Plaintext (DecryptedMessageView)
        requires scope full.

        '
      operationId: getMessage
      security:
      - bearerKey: []
      parameters:
      - name: sealed
        in: query
        schema:
          type: boolean
          default: true
        description: true (default) returns the sealed blob; false requests decryption (scope full required)
      responses:
        '200':
          description: Sealed view (default) or decrypted view (scope full)
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/SealedMessageView'
                - $ref: '#/components/schemas/DecryptedMessageView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-scopes:
      - read
    patch:
      tags:
      - receive
      summary: Move a message between folders and/or set its read state
      operationId: patchMessage
      security:
      - bearerKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessagePatch'
      responses:
        '200':
          description: The updated message metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-scopes:
      - send
    delete:
      tags:
      - receive
      summary: Permanently delete a message and its lifecycle metadata (trash follows the same route)
      operationId: deleteMessage
      security:
      - bearerKey: []
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-scopes:
      - send
  /v1/messages/{id}/attachments/{aid}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^msg_[a-z0-9]{8,32}$
    - name: aid
      in: path
      required: true
      schema:
        type: string
        pattern: ^atc_[a-z0-9]{8,32}$
    - name: sealed
      in: query
      schema:
        type: boolean
        default: true
    get:
      tags:
      - receive
      summary: Download one attachment (sealed blob by default; decrypted requires scope full)
      operationId: getMessageAttachment
      security:
      - bearerKey: []
      responses:
        '200':
          description: Attachment bytes (application/octet-stream)
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
      x-scopes:
      - read
  /v1/templates:
    get:
      tags:
      - templates
      summary: List templates
      operationId: listTemplates
      security:
      - bearerKey: []
      responses:
        '200':
          description: Templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Template'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-scopes:
      - read
    post:
      tags:
      - templates
      summary: Create template (name unique per account)
      operationId: createTemplate
      security:
      - bearerKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-scopes:
      - send
  /v1/templates/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^tpl_[a-z0-9]{8,32}$
    get:
      tags:
      - templates
      summary: Get template
      operationId: getTemplate
      security:
      - bearerKey: []
      responses:
        '200':
          description: The template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '404':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-scopes:
      - read
    patch:
      tags:
      - templates
      summary: Partial update (id/updated_at are server-owned; 409 on duplicate name)
      operationId: updateTemplate
      security:
      - bearerKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplatePatch'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '409':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-scopes:
      - send
    delete:
      tags:
      - templates
      summary: Delete template
      operationId: deleteTemplate
      security:
      - bearerKey: []
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-scopes:
      - send
  /v1/templates/{id}/test-send:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^tpl_[a-z0-9]{8,32}$
    post:
      tags:
      - templates
      summary: Send a rendered template test
      operationId: testTemplate
      security:
      - bearerKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - to
              properties:
                to:
                  type: array
                  items:
                    type: string
                    format: idn-email
                  maxItems: 5
                variables:
                  type: object
                  additionalProperties: true
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendAccepted'
        '402':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-scopes:
      - send
  /v1/drafts:
    get:
      tags:
      - drafts
      summary: List saved drafts (newest save first)
      operationId: listDrafts
      security:
      - bearerKey: []
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: Page of drafts, bodies included (a draft is small and the
            compose box needs it back verbatim)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-scopes:
      - read
    post:
      tags:
      - drafts
      summary: Save a new draft
      operationId: createDraft
      security:
      - bearerKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftCreate'
      responses:
        '201':
          description: Draft saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Draft'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-scopes:
      - send
  /v1/drafts/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^drf_[a-z0-9]{8,32}$
    get:
      tags:
      - drafts
      summary: Get one draft, bodies included
      operationId: getDraft
      security:
      - bearerKey: []
      responses:
        '200':
          description: The draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Draft'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Problem'
      x-scopes:
      - read
    patch:
      tags:
      - drafts
      summary: Partial update; present members replace, absent members are kept,
        updated_at is bumped
      operationId: updateDraft
      security:
      - bearerKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftPatch'
      responses:
        '200':
          description: Updated draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Draft'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
      x-scopes:
      - send
    delete:
      tags:
      - drafts
      summary: Discard a draft
      operationId: deleteDraft
      security:
      - bearerKey: []
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Problem'
      x-scopes:
      - send
  /v1/drafts/{id}/send:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^drf_[a-z0-9]{8,32}$
    post:
      tags:
      - drafts
      summary: Send a draft (same validation, sealing and queue path as POST /v1/emails;
        the draft is deleted only after the email is accepted)
      operationId: sendDraft
      security:
      - bearerKey: []
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-scopes:
      - send
  /v1/domains:
    get:
      tags:
      - domains
      summary: List managed domains
      operationId: listDomains
      security:
      - bearerKey: []
      responses:
        '200':
          description: Domains
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Domain'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Problem'
      x-scopes:
      - full
    post:
      tags:
      - domains
      summary: Add domain (returns DNS records to publish; priority is a separate field, never inside
        value)
      operationId: addDomain
      security:
      - bearerKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                  format: hostname
      responses:
        '201':
          description: Added. Fetch the DNS records to publish via GET /v1/domains/{id}/dns.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domain'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Problem'
      x-scopes:
      - full
  /v1/domains/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^dom_[a-z0-9]{8,32}$
    get:
      tags:
      - domains
      summary: Domain verification status (verify=now forces a re-check)
      operationId: getDomain
      security:
      - bearerKey: []
      parameters:
      - name: verify
        in: query
        schema:
          type: string
          enum:
          - now
      responses:
        '200':
          description: The domain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Domain'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Problem'
      x-scopes:
      - full
  /v1/domains/{id}/dns:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^dom_[a-z0-9]{8,32}$
    get:
      tags:
      - domains
      summary: Exact DNS records to publish (introspection sub-resource)
      operationId: getDomainDns
      security:
      - bearerKey: []
      responses:
        '200':
          description: DNS record list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DnsRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Problem'
      x-scopes:
      - full
  /v1/webhooks:
    get:
      tags:
      - webhooks
      summary: List webhooks (secrets are never returned after creation)
      operationId: listWebhooks
      security:
      - bearerKey: []
      responses:
        '200':
          description: Webhooks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebhookView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Problem'
      x-scopes:
      - full
    post:
      tags:
      - webhooks
      summary: Create webhook (secret returned once)
      operationId: createWebhook
      security:
      - bearerKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookCreate'
      responses:
        '201':
          description: Created (secret shown once)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookCreated'
        '401':

        description:
          type: string
          maxLength: 500
          description: short human description; omitted when empty
        subject:
          type: string
        html:
          type: string
        text:
          type: string
        updated_at:
          type: string
          format: date-time
    TemplateCreate:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 500
        subject:
          type: string
        html:
          type: string
        text:
          type: string
    TemplatePatch:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 500
        subject:
          type: string
        html:
          type: string
        text:
          type: string
    Draft:
      type: object
      additionalProperties: false
      required:
      - id

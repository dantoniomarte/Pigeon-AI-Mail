  /v1/auth/login:
    post:
      tags:
      - account
      security: []
      summary: 'Dashboard/webmail session login (browser flows; API keys are for machines). Body: email
        plus a required `code` in one of two roles: a TOTP or recovery code when 2FA is enrolled, or a
        one-time bootstrap/invitation token for an account that has no 2FA. A login without `code` is
        rejected with 403 mfa-required. Sets an HttpOnly session cookie (SameSite=Strict).

        '
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: idn-email
                password:
                  type: string
                  description: 'Accepted for contract compatibility but unused — v0.1 has no
                    password realm. Login is `email` + required `code`.'
                code:
                  type: string
                  description: 'TOTP (6 or 8 digits) or one-time recovery code when 2FA is enrolled;
                    otherwise a one-time bootstrap/invitation token from POST /v1/orgs/{id}/members
                    or POST /v1/orgs/{id}/invitations. A code that matches nothing is a 401 — never
                    a silent success.

                    '
      responses:
        '200':
          description: Session established (a valid code was accepted)
          headers:
            Set-Cookie:
              schema:
                type: string
              description: pigeon_session=...; HttpOnly; SameSite=Strict
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '403':
          description: Every login requires a code — missing, invalid, or replayed code, or 2FA challenge; problem type mfa-required for missing code, unauthorized (401) for wrong/replayed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/auth/check:
    get:
      tags:
      - account
      summary: '204 when the session cookie (pigeon_session) is valid. The cookie is HttpOnly, so
        browser JavaScript cannot read it; the webmail probes this endpoint to learn whether a
        session exists without paying for a data fetch.

        '
      operationId: authCheck
      responses:
        '204':
          description: The session cookie is valid
        '401':
          $ref: '#/components/responses/Problem'
  /v1/account/2fa/enroll:
    post:
      tags:
      - account
      summary: Begin TOTP enrollment — SESSION auth (the session is the re-auth in v0.1; a
        password realm lands later). No request body.
      operationId: enroll2fa
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Provisioning data
          content:
            application/json:
              schema:
                type: object
                required:
                - secret_base32
                - otpauth_uri
                properties:
                  secret_base32:
                    type: string
                  otpauth_uri:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/account/2fa/activate:
    post:
      tags:
      - account
      summary: Activate TOTP (returns 10 one-time recovery codes, shown once)
      operationId: activate2fa
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpCode'
      responses:
        '200':
          description: Activated
          content:
            application/json:
              schema:
                type: object
                properties:
                  recovery_codes:
                    type: array
                    items:
                      type: string
                    maxItems: 10
                    minItems: 10
        '422':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/account/2fa/disable:
    post:
      tags:
      - account
      summary: Disable 2FA — SESSION auth; requires a current valid code (TOTP or recovery code)
      operationId: disable2fa
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpCode'
      responses:
        '204':
          description: Disabled
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/account/2fa/verify:
    post:
      tags:
      - account
      summary: Verify a TOTP/recovery code for the current session (step-up checks)
      operationId: verify2fa
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpCode'
      responses:
        '200':
          description: Valid
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
      description: 'Replay protection: the service layer persists the last-used TOTP counter (crypto crate
        owns stateless verify; the service owes consume-once). Attempt limiting: 5 failures/15 min → 429.'
components:
  securitySchemes:
    bearerKey:
      type: http
      scheme: bearer
      description: 'API key pk_... (43 base64url chars). Privilege tier per operation in x-scopes: send
        | read | full (machine-readable extension; bearer schemes cannot carry OAuth-style scopes).'
    sessionCookie:
      type: apiKey
      in: cookie
      name: pigeon_session
      description: Dashboard/webmail session (HttpOnly, SameSite=Strict). 2FA protects these sessions.
  responses:
    Problem:
      description: RFC 7807 problem
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing/invalid key or session
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Rate limit or quota exceeded
      headers:
        Retry-After:
          schema:
            type: integer
            description: seconds
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  headers:
    XRateLimitLimit:
      description: sustained req/s limit for the key
      schema:
        type: integer
    XRateLimitRemaining:
      description: requests remaining in the current window
      schema:
        type: integer
    XRateLimitReset:
      description: unix seconds when the window resets
      schema:
        type: integer
  schemas:
    Problem:
      type: object
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          enum:
          - rate-limited
          - quota-exceeded
          - idempotent-replay
          - not-cancellable
          - validation
          - unauthorized
          - forbidden
          - not-found
          - conflict
          - payload-too-large
          - unavailable
          - mfa-required
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        id:
          type: string
          description: original email id (idempotent-replay only)

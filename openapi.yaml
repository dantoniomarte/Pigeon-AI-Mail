          maxItems: 10
          items:
            type: string
            pattern: ^[a-z0-9-]{1,40}$
        updated_at:
          type: string
          format: date-time
    DraftCreate:
      type: object
      additionalProperties: false
      description: every member is optional — a draft is written while it is still being written
      properties:
        from:
          type: string
          maxLength: 320
        to:
          type: array
          maxItems: 50
          items:
            type: string
            format: idn-email
        cc:
          type: array
          items:
            type: string
            format: idn-email
        bcc:
          type: array
          items:
            type: string
            format: idn-email
        subject:
          type: string
          maxLength: 998
        html:
          type: string
        text:
          type: string
        attachments:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/Attachment'
        tags:
          type: array
          maxItems: 10
          items:
            type: string
            pattern: ^[a-z0-9-]{1,40}$
    DraftPatch:
      type: object
      additionalProperties: false
      description: present members replace the stored value, absent members are kept
      properties:
        from:
          type: string
          maxLength: 320
        to:
          type: array
          maxItems: 50
          items:
            type: string
            format: idn-email
        cc:
          type: array
          items:
            type: string
            format: idn-email
        bcc:
          type: array
          items:
            type: string
            format: idn-email
        subject:
          type: string
          maxLength: 998
        html:
          type: string
        text:
          type: string
        attachments:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/Attachment'
        tags:
          type: array
          maxItems: 10
          items:
            type: string
            pattern: ^[a-z0-9-]{1,40}$
    DraftPage:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      properties:

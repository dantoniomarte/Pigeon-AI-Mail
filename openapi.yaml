    put:
      tags:
      - catchall
      summary: Set what happens to unknown local parts of a domain
      description: 'The rule is the **domain-level decision**, not a recipient list: `route` copies the
        message into every non-paused assignee (see `POST /v1/catchall/{domain}/assign`), and `discard` accepts
        and drops it so a sender cannot tell a real address from a made-up one. Re-putting a domain replaces
        the action and keeps the assignees, so flipping the decision never forgets who was receiving the
        mail. With no rule at all the inbound server keeps answering `550`.

        '
      operationId: putCatchallRule

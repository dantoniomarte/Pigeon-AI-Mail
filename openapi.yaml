            type: string
            format: idn-email
        cc:
          type: array
          items:
            type: string
            format: idn-email
        bcc:
          type: array
          items:
            type: string
            format: idn-email
          description: a draft echoes bcc back to its own account — nothing has left yet
        subject:
          type: string
        html:
          type: string
        text:
          type: string
        attachments:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/Attachment'
        tags:

[package]
name = "pigeon"
description = "Pigeon Mail server binary: `pigeon serve` and `pigeon keygen`"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "pigeon"
path = "src/main.rs"

[dependencies]
pigeon-api.workspace = true
pigeon-mcp.workspace = true
pigeon-core.workspace = true
pigeon-crypto.workspace = true
pigeon-smtp.workspace = true
store.workspace = true
axum.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
tempfile.workspace = true
# The `unpin-peer-key` recovery writes an audit row, and `Storage` exposes no audit
# reader: the CLI test reads the table directly to prove the operator action left a
# trail.
rusqlite.workspace = true

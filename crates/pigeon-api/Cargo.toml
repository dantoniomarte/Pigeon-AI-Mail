[package]
name = "pigeon-api"
description = "Pigeon Mail HTTP API: axum router, handlers, auth, problem+json"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
pigeon-core.workspace = true
pigeon-crypto.workspace = true
pigeon-dkim.workspace = true
store.workspace = true
# OpenPGP primitives for the layer-3 seal (key generation, seal, open) and the
# certificate type the WKD endpoints hand around.
sequoia-openpgp.workspace = true
# WKD's advanced path keys a request by z-base-32(SHA-1(local part)), which is
# the draft's definition — not a signature, so this is the only use here.
sha1 = "0.10"
# Outbound HTTPS for WKD discovery: the workspace already builds rustls for
# SMTP, and `webpki-roots` supplies the CA bundle the image does not ship.
rustls.workspace = true
webpki-roots.workspace = true
axum.workspace = true
base64.workspace = true
hex.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tower = { workspace = true, features = ["util"] }
# The catch-all end-to-end test drives the real inbound SMTP server against the
# database the API just configured, rather than asserting that a method was
# called. `pigeon-smtp` depends on `pigeon-api`, so this is a dev-dependency
# cycle — legal in Cargo, and it cannot leak into the shipped binary.
pigeon-smtp.workspace = true

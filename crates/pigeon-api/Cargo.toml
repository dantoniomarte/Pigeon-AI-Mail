[package]
name = "pigeon-api"
description = "Pigeon Mail HTTP API: axum router, handlers, auth, problem+json"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
pigeon-core.workspace = true
pigeon-crypto.workspace = true
pigeon-dkim.workspace = true
store.workspace = true
axum.workspace = true
base64.workspace = true
hex.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tower = { workspace = true, features = ["util"] }
# The catch-all end-to-end test drives the real inbound SMTP server against the
# database the API just configured, rather than asserting that a method was
# called. `pigeon-smtp` depends on `pigeon-api`, so this is a dev-dependency
# cycle — legal in Cargo, and it cannot leak into the shipped binary.
pigeon-smtp.workspace = true

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Pigeon Mail: a carrier pigeon carrying an envelope">
  <title>Pigeon Mail</title>
  <defs>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F27A54"/>
      <stop offset="1" stop-color="#D94F2B"/>
    </linearGradient>
  </defs>
  <!-- body -->
  <path d="M118 52c-26 4-44 24-46 50-1 14 3 27 12 37 10 11 24 17 40 17 18 0 34-8 44-22 8-11 11-25 9-39l-17 6c-3-8-9-14-17-17l7-14-21 6c-3-9-6-17-11-24z" fill="url(#wing)"/>
  <!-- head + beak -->
  <circle cx="157" cy="70" r="22" fill="#F27A54"/>
  <path d="M176 66l14 5-13 6z" fill="#1A1D27"/>
  <circle cx="163" cy="66" r="3.4" fill="#FFFFFF"/>
  <!-- wing detail -->
  <path d="M104 92c14-4 30-2 42 8-6 14-20 23-37 23-8 0-16-2-22-7 2-11 8-20 17-24z" fill="#FFFFFF" opacity=".22"/>
  <!-- envelope -->
  <g>
    <rect x="88" y="150" width="86" height="58" rx="8" fill="#FFFFFF" stroke="#1A1D27" stroke-width="5"/>
    <path d="M92 156l39 28 39-28" fill="none" stroke="#1A1D27" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- legs -->
  <path d="M112 205v14M136 205v14" stroke="#1A1D27" stroke-width="5" stroke-linecap="round"/>
  <!-- motion lines (the letter is on its way) -->
  <g stroke="#E8613C" stroke-width="6" stroke-linecap="round" opacity=".85">
    <path d="M196 148h26M188 168h30M196 188h22"/>
  </g>
</svg>

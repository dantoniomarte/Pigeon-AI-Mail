[workspace]
resolver = "2"
members = [
    "crates/pigeon-mcp",
    "crates/pigeon-dkim",
    "crates/pigeon-crypto",
    "crates/pigeon-core",
    "crates/store",
    "crates/pigeon-api",
    "crates/pigeon-smtp",
    "crates/pigeon",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.85"
authors = ["Pigeon Mail contributors"]
repository = "https://github.com/dantoniomarte/Pigeon-AI-Mail"

[workspace.dependencies]
sha2 = { version = "0.10", features = ["oid"] }
rsa = { version = "0.9", features = ["sha2"] }
pigeon-core = { path = "crates/pigeon-core" }
pigeon-crypto = { path = "crates/pigeon-crypto" }
pigeon-api = { path = "crates/pigeon-api" }
pigeon-mcp = { path = "crates/pigeon-mcp" }
pigeon-smtp = { path = "crates/pigeon-smtp" }
pigeon-dkim = { path = "crates/pigeon-dkim" }
store = { path = "crates/store" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "fs"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
thiserror = "2"
zeroize = "1"
# OpenPGP (RFC 4880/9580) for the layer-3 end-to-end payload seal. The pure-Rust
# crypto backend avoids a C toolchain (nettle/openssl) in the build; the layer
# only needs Ed25519 signing + Cv25519 encryption keys.
sequoia-openpgp = { version = "2.4", default-features = false, features = [
    "crypto-rust",
    "compression-deflate",
    "allow-experimental-crypto",
    "allow-variable-time-crypto",
] }
hex = "0.4"
# SMTP transport. hickory 0.25 renamed the runtime feature to `tokio`; it is
# enabled by default together with `system-config` (/etc/resolv.conf).
hickory-resolver = { version = "0.25", default-features = false, features = [
    "tokio",
    "system-config",
] }
# `ring` instead of the default `aws-lc-rs` provider: no CMake/NASM in the
# build, and v0.1 only needs an anonymous client handshake (see pigeon-smtp).
tokio-rustls = { version = "0.26", default-features = false, features = [
    "logging",
    "tls12",
    "ring",
] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
# Trust anchors for outbound HTTPS key discovery (WKD). A discovered key decides
# who mail is sealed to, so it must come over an authenticated connection.
webpki-roots = "1"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

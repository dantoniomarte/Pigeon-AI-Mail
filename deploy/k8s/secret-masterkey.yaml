# Pigeon Mail — master key secret.
#
# SKELETON / PLACEHOLDER. The value below is NOT a key: it is a dummy that the
# server will reject (it is not 32 bytes of real entropy). Do not apply this
# file as-is in any environment you care about.
#
# CREATE THE REAL SECRET WITH kubectl INSTEAD — it never lands in your shell
# history as a manifest, and it never gets committed:
#
#   openssl rand -hex 32 > master.key
#   chmod 0600 master.key
#   kubectl -n pigeon create secret generic pigeon-masterkey \
#     --from-file=master.key=./master.key
#   shred -u master.key   # keep an offline backup FIRST (see docs/DEPLOY.md)
#
# Keys rules that matter more than this file:
#   * 32 bytes (openssl rand -hex 32 => 64 hex chars).
#   * Losing it = losing every stored message. Back it up together with the DB.
#   * Rotating it is not a supported configuration (ADR 0003).
#   * The pod mounts it at /etc/pigeon/master.key via PIGEON_MASTER_KEY_FILE.
#     There is deliberately no env var carrying the key value: env vars leak
#     into crash dumps, `kubectl describe` and child processes.
apiVersion: v1
kind: Secret
metadata:
  name: pigeon-masterkey
  namespace: pigeon
  labels:
    app.kubernetes.io/name: pigeon-mail
    app.kubernetes.io/part-of: pigeon
type: Opaque
stringData:
  # PLACEHOLDER — replace via `kubectl create secret` as shown above.
  master.key: "REPLACE_WITH_64_HEX_CHARS_FROM_openssl_rand_hex_32"

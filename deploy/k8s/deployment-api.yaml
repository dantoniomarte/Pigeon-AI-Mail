# Pigeon Mail — API / MCP / web tier (stateless, scales horizontally).
#
# SKELETON: read README.md first. Two things are deliberately aspirational:
#
#  1. SPLIT MODE IS NOT IN THE BINARY CONTRACT YET. The only documented
#     subcommands are `pigeon serve` (all services in one process) and
#     `pigeon mcp` (stdio). There is no documented way to start "API only", so
#     this Deployment runs the same `serve` command as the SMTP one. Treat this
#     file as the scale-out shape from docs/ARCHITECTURE.md, not as something
#     that works against a shared SQLite file today.
#
#     Privileged-port consequence: `pigeon serve` binds :25 (PIGEON_SMTP_IN_ADDR)
#     per contract, and this container drops ALL capabilities, so a tier that
#     really runs `serve` as-is cannot bind it. If this Deployment ever needs to,
#     add `add: ["NET_BIND_SERVICE"]` to its container securityContext (as
#     deployment-smtp.yaml does) or split the listeners first.
#
#  2. SQLITE IS A SINGLE-NODE STORE. Replicas > 1 here only make sense once the
#     `Storage` trait has a shared-DB backend (ADR 0002). With the SQLite engine
#     the DB file lives on one node's PVC, so:
#       - either run this combined deployment with replicas: 1, or
#       - switch to the shared backend described in README.md.
#
# Knobs to set before applying: image tag, ingress host, resources.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pigeon-api
  namespace: pigeon
  labels:
    app.kubernetes.io/name: pigeon-mail
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: pigeon
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pigeon-mail
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pigeon-mail
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: pigeon
    spec:
      # uid/gid 10001 is baked into the image (USER 10001:10001).
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pigeon
          image: ghcr.io/dantoniomarte/pigeon-mail:latest
          imagePullPolicy: IfNotPresent
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: pigeon-config
          # The master key is a FILE (ADR 0003), mounted read-only. It is not
          # injected via envFrom/secretRef because the server reads the path in
          # PIGEON_MASTER_KEY_FILE and because env vars leak more easily.
          volumeMounts:
            - name: masterkey
              mountPath: /etc/pigeon
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          # NOTE: /var/lib/pigeon is intentionally NOT mounted here. This tier is
          # stateless in the target design; it gets the store back when a
          # shared-DB backend lands. Consequence, as written: with SQLite there
          # is no store, so /readyz fails and the pod never becomes Ready. That
          # is the expected skeleton state — the working single-node mode is
          # deployment-smtp.yaml (one pod, PVC, `replicas: 1`).

      volumes:
        - name: masterkey
          secret:
            secretName: pigeon-masterkey
            defaultMode: 0440
            items:
              - key: master.key
                path: master.key
        - name: tmp
          emptyDir: {}
